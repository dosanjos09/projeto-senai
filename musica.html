<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinervArt</title>
    <link rel="stylesheet" href="estilin.css">
    <script src="juntatudo.js"></script>
</head>
<body>
    <nav>
       <li><a class="nav" href="index.html">Início</a></li>
    </nav>
    <h1>Música</h1>
     <h3>"Sem a música a vida seria um erro."</h3>
    <h5>Friedrich Nietzsche</h5>

    <div id="lista-musica"></div>

    <script>
        fetch("/api/musica")
            .then(response => response.json())
            .then(dados => {
                const lista = document.getElementById("lista-musica");

                dados.forEach(album => {
                    lista.innerHTML += `
                        <div class="obra">
                            <h3>${album.nome}</h3>
                            <p>${album.artista}</p>
                            <hr>
                        </div>
                    `;
                });
            })
            .catch(erro => console.error(erro));
        </script>
</body>
</html>
