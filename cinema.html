<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinervArt - Cinema</title>
    <link rel="stylesheet" href="estilin.css">
    <script src="juntatudo.js"></script>
</head>
<body>
    <nav>
        <a class="nav" href="index.html">Início</a>
    </nav>

    <h1>Cinema</h1>
    <h3>"Cinema é a fraude mais bonita do mundo."</h3>
    <h5>Jean-Luc Godard</h5>

    <hr>

    <h2>Filmes e diretores</h2>

    <div id="lista-cinema"></div>

    <script>
        fetch("/api/cinema")
            .then(response => response.json())
            .then(dados => {
                const lista = document.getElementById("lista-cinema");

                dados.forEach(filme => {
                    lista.innerHTML += `
                        <div class="obra">
                            <h3>${filme.nome}</h3>
                            <p>${filme.artista}</p>
                            <hr>
                        </div>
                    `;
                });
            })
            .catch(erro => console.error(erro));
    </script>
</body>
