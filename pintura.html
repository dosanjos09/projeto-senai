<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinervArt - Pintura</title>
    <link rel="stylesheet" href="estilin.css">
    <script src="juntatudo.js"></script>
</head>

<body>

    <nav>
        <a class="nav" href="index.html">Início</a>
    </nav>

    <h1>Pintura</h1>

    <h3>"A pintura nunca é prosa. É poesia que se escreve com versos de rima plástica."</h3>

    <h5>Pablo Picasso</h5>

    <hr>

    <h2>Obras cadastradas</h2> 

    <!-- Aqui serão exibidas as obras do banco -->
    <div id="lista-pinturas"></div>

    <script>
        fetch("/api/pintura")
            .then(response => response.json())
            .then(dados => {
                const lista = document.getElementById("lista-pinturas");

                dados.forEach(obra => {
                    lista.innerHTML += `
                        <div class="obra">
                            <h3>${obra.nome}</h3>
                            <p>${obra.artista}</p>
                            <hr>
                        </div>
                    `;
                });
            })
            .catch(erro => console.error(erro));
        </script>

</body>
